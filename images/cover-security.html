<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平安证券APP数据分析报告 - 封面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .cover {
            width: 800px;
            height: 450px;
            background: linear-gradient(145deg, #1e1e3f 0%, #2d2d5a 100%);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .cover::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.1) 0%, transparent 70%);
        }
        .cover::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 60%);
        }
        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff5722, #f59e0b);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .metric {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .metric-value {
            font-size: 26px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff5722, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
        .charts {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            position: relative;
            z-index: 1;
        }
        .chart-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .chart-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bar-label {
            width: 80px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-align: right;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 10px;
            color: white;
            font-weight: 500;
        }
        .bar-fill.guoxin { background: linear-gradient(90deg, #87CEEB, #5fb3d4); width: 96%; }
        .bar-fill.pingan { background: linear-gradient(90deg, #FF5722, #f59e0b); width: 94%; }
        .bar-fill.zhongxin { background: linear-gradient(90deg, #DAA520, #b8941a); width: 92%; }
        .bar-fill.dongfang { background: linear-gradient(90deg, #98FB98, #7ed87e); width: 94%; }
        .pie-chart {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 100%;
        }
        .pie {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#10B981 0deg 194deg, #EF4444 194deg 360deg);
            position: relative;
        }
        .pie::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #1e1e3f;
            border-radius: 50%;
        }
        .pie-legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .legend-dot.positive { background: #10B981; }
        .legend-dot.negative { background: #EF4444; }
        .footer {
            position: absolute;
            bottom: 30px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }
        .author {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        .date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="header">
            <div class="badge">📊 竞品分析</div>
            <div class="title">平安证券APP数据分析报告</div>
            <div class="subtitle">基于vivo应用商店用户评价数据</div>
        </div>
        
        <div class="metrics">
            <div class="metric">
                <div class="metric-value">4.7</div>
                <div class="metric-label">APP评分</div>
            </div>
            <div class="metric">
                <div class="metric-value">3178万</div>
                <div class="metric-label">下载量</div>
            </div>
            <div class="metric">
                <div class="metric-value">5062</div>
                <div class="metric-label">评论数</div>
            </div>
            <div class="metric">
                <div class="metric-value">54%</div>
                <div class="metric-label">好评率</div>
            </div>
        </div>
        
        <div class="charts">
            <div class="chart-box">
                <div class="chart-title">📈 八大券商APP评分对比</div>
                <div class="bar-chart">
                    <div class="bar-item">
                        <div class="bar-label">国信证券</div>
                        <div class="bar-track"><div class="bar-fill guoxin">4.8</div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">平安证券</div>
                        <div class="bar-track"><div class="bar-fill pingan">4.7</div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">东方财富</div>
                        <div class="bar-track"><div class="bar-fill dongfang">4.7</div></div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">中信证券</div>
                        <div class="bar-track"><div class="bar-fill zhongxin">4.6</div></div>
                    </div>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">💬 平安 vs 中信 好评差评</div>
                <div class="pie-chart">
                    <div class="pie"></div>
                    <div class="pie-legend">
                        <div class="legend-item">
                            <div class="legend-dot positive"></div>
                            <span>好评 54%</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot negative"></div>
                            <span>差评 46%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="author">数据分析师：关艺贤</div>
            <div class="date">2026年6月</div>
        </div>
    </div>
</body>
</html>
