* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg-dark); color: var(--text-primary); overflow-x: hidden; }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(20px); background: rgba(15,14,23,0.8); border-bottom: 1px solid rgba(108,99,255,0.1); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.nav-links { display: flex; list-style: none; gap: 2rem; }
.nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }

.report-page { padding-top: 80px; min-height: 100vh; }
.report-header { padding: 3rem 2rem; max-width: 1200px; margin: 0 auto; }
.report-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; margin-bottom: 1.5rem; transition: color 0.3s; cursor: pointer; background: none; border: none; }
.report-back:hover { color: var(--primary-light); }
.report-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
.report-subtitle { color: var(--text-muted); font-size: 1rem; }
.report-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; padding: 0 2rem; max-width: 1200px; margin: 2rem auto; }
.metric-card { background: var(--bg-card); border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(108,99,255,0.1); text-align: center; }
.metric-value { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.metric-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem; }
.report-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 2rem; padding: 0 2rem; max-width: 1200px; margin: 2rem auto; }
.chart-card { background: var(--bg-card); border-radius: 20px; padding: 1.5rem; border: 1px solid rgba(108,99,255,0.1); }
.chart-card.full-width { grid-column: 1 / -1; }
.chart-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(108,99,255,0.1); }
.chart-container { width: 100%; height: 400px; }
.chart-container.tall { height: 500px; }
.report-insights { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
.insight-item { background: var(--bg-card); border-radius: 16px; padding: 1.5rem; border-left: 4px solid var(--primary); margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-start; }
.insight-num { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--primary); min-width: 40px; }
.insight-text { color: var(--text-secondary); line-height: 1.7; font-size: 0.95rem; }
.footer { text-align: center; padding: 3rem 2rem; border-top: 1px solid rgba(108,99,255,0.1); color: var(--text-muted); font-size: 0.85rem; margin-top: 3rem; }
@media (max-width: 768px) { .report-charts{grid-template-columns:1fr} .report-title{font-size:1.8rem} }</style>
