    });

    echarts.init(document.getElementById('r1-chart-month-trend')).setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: cd.monthly_trend.map(function(m){ return m.month; }), axisLabel: { color: '#A7A9BE' } },
        yAxis: { type: 'value', axisLabel: { color: '#A7A9BE' }, splitLine: { lineStyle: { color: '#333' } } },
        series: [{ data: cd.monthly_trend.map(function(m){ return m.count; }), type: 'line', smooth: true,
            areaStyle: { color: { type: 'linear', x:0, y:0, x2:0, y2:1, colorStops: [{offset:0, color:'rgba(108,99,255,0.4)'}, {offset:1, color:'rgba(108,99,255,0.05)'}] } },
            lineStyle: { color: colors[0], width: 3 }, itemStyle: { color: colors[0] }
        }]
    });
    
    // 月度评分趋势
    echarts.init(document.getElementById('r1-chart-month-rating')).setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: cd.monthly_avg_rating.map(function(m){ return m.month; }), axisLabel: { color: '#A7A9BE' } },
        yAxis: { type: 'value', min: 3, max: 5, axisLabel: { color: '#A7A9BE' }, splitLine: { lineStyle: { color: '#333' } } },
        series: [{ data: cd.monthly_avg_rating.map(function(m){ return m.avg_rating; }), type: 'line', smooth: true,
            lineStyle: { color: colors[2], width: 3 }, itemStyle: { color: colors[2] }
        }]
    });
    
    // 词云
    echarts.init(document.getElementById('r1-chart-comment-wordcloud')).setOption({
        series: [{ type: 'wordCloud', shape: 'circle', left: 'center', top: 'center', width: '90%', height: '90%',
            sizeRange: [12, 50], rotationRange: [-45, 45], gridSize: 8,
            data: cd.keywords.top20.map(function(k){ return {name: k.word, value: k.count, textStyle: {color: colors[Math.floor(Math.random()*colors.length)]}}; }),
            textStyle: { fontFamily: 'Noto Sans SC' }
        }]
    });
    
    // 评论长度
    var lenKeys = Object.keys(cd.avg_length_by_star);
    var lenVals = Object.values(cd.avg_length_by_star);
    echarts.init(document.getElementById('r1-chart-avg-len')).setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: lenKeys.map(function(k){ return k+'星'; }), axisLabel: { color: '#A7A9BE' } },
        yAxis: { type: 'value', axisLabel: { color: '#A7A9BE' }, splitLine: { lineStyle: { color: '#333' } } },
        series: [{ data: lenVals, type: 'bar', itemStyle: { color: colors[6], borderRadius: [4,4,0,0] } }]
    });
    
    // 评论样本
    var samplesHtml = '<div style="padding:1rem;">';
    cd.sample_reviews.forEach(function(s) {
        samplesHtml += '<div style="margin-bottom:1rem; padding:1rem; background:rgba(108,99,255,0.05); border-radius:8px; border-left:3px solid ' + colors[s.rating-1] + ';">';
        samplesHtml += '<div style="font-weight:600; margin-bottom:0.5rem; color:' + colors[s.rating-1] + ';">' + s.rating + '星评价</div>';
        samplesHtml += '<div style="color:#A7A9BE; font-size:0.9rem;">' + s.content.substring(0,200) + (s.content.length>200?'...':'') + '</div>';
        samplesHtml += '</div>';
    });
    samplesHtml += '</div>';
    document.getElementById('r1-chart-samples').innerHTML = samplesHtml;
    
    // 洞察
    var insights = [
        '用户满意度极高：86.4%的评论为正面评价，5星好评占比高达72.2%，产品整体口碑优秀',
        '负面评论聚焦质量问题：1-2星评论中"broken"、"defective"等词高频出现，质量管控是提升关键',
        '评论热度持续增长：2024年下半年评论量显著上升，市场关注度持续走高，新品发布带动讨论'
    ];
    document.getElementById('r1-comment-insights').innerHTML = insights.map(function(t, idx) {
        return '<div class="insight-item"><span class="insight-num">0' + (idx+1) + '</span><span class="insight-text">' + t + '</span></div>';
    }).join('');
}
initCharts
initCharts();
</script>
</body>
</html>
